name: Polymarket Bot

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch:          # manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore trade logs
        uses: actions/cache/restore@v4
        with:
          path: logs/
          key: trade-logs-${{ github.run_id }}
          restore-keys: trade-logs-

      - name: Run bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --mode paper

      - name: Save trade logs
        uses: actions/cache/save@v4
        if: always()
        with:
          path: logs/
          key: trade-logs-${{ github.run_id }}

      - name: Commit trade logs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f logs/trades.jsonl logs/bot.log 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update trade logs [skip ci]" && git push) || true
